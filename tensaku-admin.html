<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>添削の集計</title>
<style>
:root{--bg:#f1f4f2;--ink:#1f2328;--sub:#5b6470;--line:#d5dade;--blue:#3aa7e8;--green:#2F9E44;--red:#E03131;--amber:#b7791f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:18px;margin:22px 0 8px}
.box{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
input,select{font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{font-weight:800;border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:12px 14px}
.kpi .l{font-size:13px;color:var(--sub);font-weight:700}
.kpi .v{font-size:28px;font-weight:900;line-height:1.2}
.kpi .s{font-size:13px;color:var(--sub)}
.bar{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.tw{overflow-x:auto;background:#fff;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid #eef0f2;text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--sub);background:#fafbfc}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.q{background:#fff;border-radius:14px;padding:14px;margin-top:10px}
.q .tg{font-size:13px;color:var(--sub);font-weight:700}
.q .qt{font-weight:800;margin:4px 0}
.q .ok{color:var(--green);font-weight:700;font-size:15px}
.a{border-top:1px solid #f0f0f0;padding:8px 0 4px;font-size:15px}
.a b{margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;margin-right:4px}
.p-ok{background:#EBFBEE;color:var(--green)}.p-ng{background:#FFF5F5;color:var(--red)}.p-na{background:#f1f3f5;color:var(--sub)}
.p-ad{background:#e7f5fd;color:#1971c2}.p-rj{background:#fff0e6;color:#c2410c}
.cm{white-space:pre-wrap;background:#fffbea;border-radius:8px;padding:6px 10px;margin-top:4px}
details summary{cursor:pointer;color:var(--sub);font-size:14px;margin-top:6px}
.ph img{max-width:100%;border-radius:8px;margin-top:6px}
.err{color:var(--red);font-weight:700;margin-top:8px}
.more{display:block;margin:14px auto 0}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap">
  <h1>📊 問題の添削　集計（先生用）</h1>
  <div id="login" class="box">
    <div>先生用の合言葉を入れてください。</div>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="code" type="password" autocomplete="off" style="flex:1"><button class="btn" id="go">見る</button></div>
    <div class="err" id="err"></div>
  </div>
  <div id="main" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient('https://hwctwbnzjjdllqsmlvqm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3Y3R3Ym56ampkbGxxc21sdnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzkzMDQsImV4cCI6MjA5NjQ1NTMwNH0.quP2UmR59c1ULUgZkqaq0kzeD8VlOY3cKH4ZaZJwtf0', {auth:{persistSession:false}});
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CODE = '', D = null, F = 'all', SEARCH = '', SHOW = 40;
try { CODE = sessionStorage.getItem('tensaku_admin') || '' } catch (e) {}
const ss = (v) => { try { sessionStorage.setItem('tensaku_admin', v) } catch (e) {} };

$('#go').onclick = () => go($('#code').value.trim());
$('#code').onkeydown = (e) => { if (e.key === 'Enter') go($('#code').value.trim()) };
async function go(code){
  $('#err').textContent = ''; $('#go').disabled = true;
  const { data, error } = await db.rpc('qr_admin', { p_code: code });
  $('#go').disabled = false;
  if (error) { $('#err').textContent = error.message.includes('合言葉') ? '合言葉がちがいます。' : '読みこめませんでした：' + error.message; $('#login').hidden = false; return }
  CODE = code; ss(code); D = data; $('#login').hidden = true; $('#main').hidden = false; draw();
}
const jp = (t) => new Date(t).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const pickPill = (p) => p === 0 ? '<span class="pill p-ok">正解</span>' : p === -1 ? '<span class="pill p-na">答えられない</span>' : p == null ? '' : '<span class="pill p-ng">不正解</span>';
const vPill = (v) => v === 'adopt' ? '<span class="pill p-ad">👍 採用した方が良い</span>' : v === 'reject' ? '<span class="pill p-rj">👎 不採用にした方が良い</span>' : '';

function draw(){
  const Q = D.questions, A = D.answers;
  const by = {}; A.forEach((a) => (by[a.qid] ||= []).push(a));
  const seen = Q.filter((q) => by[q.id]).length, pct = Q.length ? Math.round(seen / Q.length * 100) : 0;
  const people = {};
  A.forEach((a) => { const p = people[a.reviewer] ||= { name: a.reviewer, jobs: new Set(), n: 0, ok: 0, tried: 0, cant: 0, ad: 0, rj: 0, cm: 0, last: a.at };
    p.jobs.add(a.job); p.n++; if (a.picked === -1) p.cant++; else if (a.picked != null) { p.tried++; if (a.picked === 0) p.ok++ }
    if (a.verdict === 'adopt') p.ad++; if (a.verdict === 'reject') p.rj++; if (a.comment) p.cm++; if (a.at > p.last) p.last = a.at });
  const ppl = Object.values(people).sort((a, b) => b.n - a.n);
  const tg = (t) => { const qs = Q.filter((q) => q.target === t); const s = qs.filter((q) => by[q.id]).length; return { n: qs.length, s, p: qs.length ? Math.round(s / qs.length * 100) : 0 } };
  const T = { 'クラーク向け': tg('クラーク'), 'ナース向け': tg('ナース'), '両方向け': tg('クラーク・ナース') };
  const rejQ = Q.filter((q) => (by[q.id] || []).some((a) => a.verdict === 'reject')).length;
  const cantQ = Q.filter((q) => (by[q.id] || []).some((a) => a.picked === -1)).length;

  $('#main').innerHTML = `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn" onclick="go(CODE)">🔄 最新にする</button><button class="btn ghost" onclick="csv()">⬇ 回答をCSVで保存</button><a class="btn ghost" style="text-decoration:none" href="tensaku.html?preview">👀 スタッフの画面で見る</a><span style="color:var(--sub);font-size:13px;align-self:center">${new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 時点</span></div>
  <div class="kpis">
    <div class="kpi"><div class="l">回答率（1人以上が見た問題）</div><div class="v">${pct}%</div><div class="s">${seen} / ${Q.length}問</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="kpi"><div class="l">回答の数</div><div class="v">${A.length}</div><div class="s">${ppl.length}人が回答</div></div>
    <div class="kpi"><div class="l">「不採用にした方が良い」がある問題</div><div class="v">${rejQ}</div><div class="s">問</div></div>
    <div class="kpi"><div class="l">「答えられない」がある問題</div><div class="v">${cantQ}</div><div class="s">問</div></div>
  </div>
  <div class="kpis" style="margin-top:10px">${Object.entries(T).map(([k, t]) => `<div class="kpi"><div class="l">${k}</div><div class="v" style="font-size:22px">${t.p}%</div><div class="s">${t.s} / ${t.n}問</div><div class="bar"><i style="width:${t.p}%"></i></div></div>`).join('')}</div>

  <h2>人ごと</h2>
  <div class="tw"><table><thead><tr><th>名前</th><th>職種</th><th>回答数</th><th>正解率</th><th>答えられない</th><th>👍採用</th><th>👎不採用</th><th>コメント</th><th>最後の回答</th></tr></thead><tbody>
  ${ppl.length ? ppl.map((p) => `<tr><td><b>${esc(p.name)}</b></td><td>${esc([...p.jobs].join('・'))}</td><td class="n">${p.n}</td><td class="n">${p.tried ? Math.round(p.ok / p.tried * 100) + '%' : '-'}</td><td class="n">${p.cant}</td><td class="n">${p.ad}</td><td class="n">${p.rj}</td><td class="n">${p.cm}</td><td>${jp(p.last)}</td></tr>`).join('') : '<tr><td colspan="9" style="color:var(--sub)">まだ回答はありません。</td></tr>'}
  </tbody></table></div>

  <h2>問題ごと</h2>
  <div class="filters">
    ${[['all', 'すべて'], ['ans', '回答あり'], ['rej', '👎不採用あり'], ['cant', '答えられないあり'], ['cm', 'コメントあり'], ['none', 'まだ誰も']].map(([k, l]) => `<button class="chip ${F === k ? 'on' : ''}" onclick="F='${k}';SHOW=40;draw()">${l}</button>`).join('')}
    <input id="sq" placeholder="ことばで探す・No" value="${esc(SEARCH)}" style="flex:1;min-width:140px">
  </div>
  <div id="ql"></div>`;
  $('#sq').oninput = (e) => { SEARCH = e.target.value; SHOW = 40; list(by) };
  list(by);
}
function list(by){
  const s = SEARCH.trim();
  const qs = D.questions.filter((q) => {
    const a = by[q.id] || [];
    if (F === 'ans' && !a.length) return false;
    if (F === 'rej' && !a.some((x) => x.verdict === 'reject')) return false;
    if (F === 'cant' && !a.some((x) => x.picked === -1)) return false;
    if (F === 'cm' && !a.some((x) => x.comment)) return false;
    if (F === 'none' && a.length) return false;
    if (s && !(String(q.no) === s || (q.question + q.choices.join('') + q.explanation + a.map((x) => x.comment + x.reviewer).join('')).includes(s))) return false;
    return true;
  });
  $('#ql').innerHTML = `<div style="color:var(--sub);font-size:14px;margin-top:8px">${qs.length}問</div>` + qs.slice(0, SHOW).map((q) => {
    const a = by[q.id] || [];
    return `<div class="q"><div class="tg">No.${q.no}　${esc(q.target)}向け　${esc(q.clinic || '')}　${esc(q.area || '')}　回答${a.length}人</div>
      <div class="qt">${esc(q.question)}</div>
      <div class="ok">正解：${esc(q.choices[0])}</div>
      <a href="tensaku.html?preview#no=${q.no}" style="font-size:14px;font-weight:700;color:#1c64b0">👀 スタッフの画面で見る</a>
      <details><summary>ほかの選択肢・解説・写真</summary><div style="font-size:15px">②${esc(q.choices[1])}　③${esc(q.choices[2])}　④${esc(q.choices[3])}</div><div style="font-size:15px;margin-top:4px">${esc(q.explanation)}</div>${q.memo ? `<div style="font-size:14px;color:var(--amber);margin-top:4px">作成メモ：${esc(q.memo)}</div>` : ''}<div style="font-size:13px;color:var(--sub)">${esc(q.source || '')}</div>${q.hasPhoto ? `<div class="ph" data-id="${q.id}"><button class="btn ghost" style="margin-top:6px" onclick="photo(this)">写真を見る</button></div>` : ''}</details>
      ${a.map((x) => `<div class="a"><b>${esc(x.reviewer)}</b><span style="color:var(--sub);font-size:13px">${esc(x.job)}・${jp(x.at)}</span><br>${pickPill(x.picked)}${vPill(x.verdict)}${x.comment ? `<div class="cm">${esc(x.comment)}</div>` : ''}</div>`).join('')}
    </div>`;
  }).join('') + (qs.length > SHOW ? `<button class="btn ghost more" onclick="SHOW+=60;list(window._by)">もっと見る（残り${qs.length - SHOW}問）</button>` : '');
  window._by = by;
}
async function photo(b){
  const box = b.parentElement; b.textContent = '読みこみ中…';
  const { data } = await db.rpc('qr_photo2', { p_code: CODE, p_qid: box.dataset.id });
  box.innerHTML = data?.photo ? `<img src="${data.photo}" alt="" style="max-height:420px">${data.full ? `<div style="font-size:13px;color:var(--sub)">押したときに出る全体の写真：</div><img src="${data.full}" alt="" style="max-height:420px">` : ''}` : '写真を読みこめませんでした';
}
function csv(){
  const qm = Object.fromEntries(D.questions.map((q) => [q.id, q]));
  const rows = [['No', 'ID', '対象', 'クリニック', '問題文', '正解', '記入した人', '職種', '答え', '意見', 'コメント', '日時']];
  D.answers.forEach((a) => { const q = qm[a.qid] || {}; rows.push([q.no, a.qid, q.target, q.clinic, q.question, (q.choices || [])[0], a.reviewer, a.job,
    a.picked === 0 ? '正解' : a.picked === -1 ? '答えられない' : a.picked == null ? '' : '不正解', a.verdict === 'adopt' ? '採用した方が良い' : a.verdict === 'reject' ? '不採用にした方が良い' : '', a.comment || '', a.at]) });
  rows.sort((x, y) => (x[0] === 'No' ? -1 : y[0] === 'No' ? 1 : x[0] - y[0]));
  const text = '﻿' + rows.map((r) => r.map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  const a = document.createElement('a'); a.href = url; a.download = '添削の回答_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
if (CODE) go(CODE);
</script>
</body></html>
