<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポイントアップチャレンジ</title>
<link rel="stylesheet" href="style.css?v=15">
<style>
.status{display:flex;justify-content:space-between;align-items:center;border-radius:18px;padding:10px 14px;color:#fff;font-weight:800;background:#3aa7e8;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.status .l{font-size:15px}.status .r{font-size:20px}
.qbox{background:#fff;border-radius:20px;padding:16px;margin-top:12px}
.qno{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:6px}
.qt{font-size:20px;font-weight:800;line-height:1.6;margin:0 0 12px}
.src{font-size:13px;color:var(--sub);margin-top:10px}
.ch{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-size:18px;font-weight:700;text-align:left;border:2px solid #c9ced4;background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;line-height:1.45}
.ch .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-size:17px}
.ch:active{background:#f3f6f8}
.ch:disabled{cursor:default}
.ch.right{border-color:#2F9E44;background:#EBFBEE}.ch.right .n{background:#2F9E44;color:#fff}
.ch.wrong{border-color:#E03131;background:#FFF5F5}.ch.wrong .n{background:#E03131;color:#fff}
.res{border-radius:20px;padding:16px;margin-top:12px;text-align:center}
.res.ok{background:#EBFBEE;border:2px solid #2F9E44}.res.ng{background:#FFF5F5;border:2px solid #E03131}
.res .big{font-size:30px;font-weight:900}
.res .pt{font-size:18px;font-weight:800;margin-top:4px}
.exp{background:#fff;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:16px;line-height:1.7;text-align:left}
.chal-btn{background:linear-gradient(#FFE066,#F59F00);color:#7a2e00;box-shadow:0 3px 0 #c76b00}
.sub-btn{background:#fff;color:var(--ink);border:2px solid #c9ced4}
.done{background:#fff;border-radius:20px;padding:22px 16px;margin-top:12px;text-align:center;font-size:17px;line-height:1.8}
.done .ic{font-size:56px}
[hidden]{display:none!important}
</style>
</head><body>
<div class="top"><a class="back" href="index.html">← もどる</a><h1>🏆 チャレンジ</h1></div>
<div class="wrap">
  <div class="status" id="status"><span class="l" id="stL">読み込み中…</span><span class="r" id="stR"></span></div>
  <div id="main"></div>
</div>
<script src="points.js?v=2"></script><script src="me.js?v=2"></script><script src="links.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="hb.js?v=6"></script>
<script>
const $=id=>document.getElementById(id), esc=ME.esc, main=$('main');
const BASE=LINKS.manual().replace(/#.*$/,'');
async function showStatus(){
  const p=await HB.myPoints(),r=PTS.rank(p.total);
  $('status').style.background=r.bg;$('status').style.color=r.fg;
  $('stL').textContent=`${r.name}・今日はあと ${p.challenge_left} 問`;$('stR').textContent=p.total+'P';
  return p;
}
function done(msg,ic){
  main.innerHTML=`<div class="done"><div class="ic">${ic}</div>${msg}</div><a class="big-btn sub-btn" href="me.html">マイページを見る</a><a class="big-btn" href="index.html">トップにもどる</a>`;
}
async function next(){
  main.innerHTML='<div class="qbox">読み込み中…</div>';
  let q;
  try{q=await HB.challengeToday()}catch(e){main.innerHTML=`<div class="qbox">読み込めませんでした（${esc(e.message)}）</div>`;return}
  if(!q.left) return done('今日の3問は、おわりました。<br>また明日、チャレンジしてください。','🎉');
  if(q.none) return done('いま出せる問題がありません。<br>AI係が新しい問題を準備しています。','📚');
  const no=3-q.left+1;
  main.innerHTML=`<div class="qbox"><div class="qno">今日の ${no} 問め（全3問）　正解すると 3P</div>
    <p class="qt">${esc(q.question)}</p>
    ${q.choices.map((c,i)=>`<button class="ch" data-i="${i+1}"><span class="n">${i+1}</span><span>${esc(c)}</span></button>`).join('')}
    ${q.source_title?`<div class="src">もとのマニュアル：${esc(q.source_title)}</div>`:''}</div>`;
  main.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i));
}
async function answer(q,pick){
  const bs=[...main.querySelectorAll('.ch')];bs.forEach(b=>b.disabled=true);
  let r;
  try{r=await HB.challengeAnswer(q.id,pick)}catch(e){alert(e.message);return next()}
  bs.forEach(b=>{const i=+b.dataset.i;if(i===r.answer)b.classList.add('right');else if(i===pick)b.classList.add('wrong')});
  const box=document.createElement('div');
  box.innerHTML=`<div class="res ${r.correct?'ok':'ng'}">
      <div class="big">${r.correct?'⭕ 正解！':'❌ ざんねん'}</div>
      <div class="pt">${r.correct?'+3P ゲット！':'正解は「'+esc(r.answer_text)+'」'}</div>
      ${r.explanation?`<div class="exp">💡 ${esc(r.explanation)}</div>`:''}
      ${r.source_post_id?`<div class="exp" style="padding:8px 14px"><a href="${LINKS.post(r.source_post_id)}">📖 マニュアル「${esc(r.source_title||'')}」を読む</a></div>`:''}
    </div>
    ${r.left>0?'<button class="big-btn chal-btn" id="nextBtn">次の問題へ（あと '+r.left+' 問）</button>':'<a class="big-btn chal-btn" href="me.html">今日の3問おわり！マイページを見る</a>'}
    <a class="big-btn sub-btn" href="index.html">トップにもどる</a>`;
  main.appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'start'});
  if($('nextBtn'))$('nextBtn').onclick=()=>{scrollTo(0,0);next()};
  showStatus().catch(()=>{});
}
(async()=>{
  if(!(await HB.ready)){
    $('stL').textContent='ログインしていません';
    main.innerHTML=`<div class="done"><div class="ic">🔑</div>チャレンジは、HUKU BASE にログインすると使えます。</div><a class="big-btn" href="${BASE}">ログインする</a>`;
    return;
  }
  try{await showStatus()}catch(e){}
  next();
})();
</script>
</body></html>
