<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>問題の添削</title>
<style>
:root{--bg:#e6f4e8;--ink:#1f2328;--sub:#5b6470;--line:#c9ced4;--blue:#3aa7e8;--green:#2F9E44;--red:#E03131}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 60px}
h1{font-size:22px;margin:6px 0 10px}
.box{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
label.t{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:150px;line-height:1.6;resize:vertical}
textarea::placeholder{color:#9aa0a6}
.btn{display:block;width:100%;font:inherit;font-size:18px;font-weight:800;border:0;border-radius:14px;padding:15px;margin-top:14px;cursor:pointer;background:var(--blue);color:#fff}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:700}
.btn.small{font-size:15px;padding:10px;margin-top:8px}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{font:inherit;font-size:18px;font-weight:800;padding:16px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.4}
.job small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.job.on{border-color:var(--blue);background:#e7f5fd}
.err{color:var(--red);font-weight:700;margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:16px;padding:10px 14px;font-weight:800}
.bar .who{font-size:16px}.bar .cnt{font-size:15px;white-space:nowrap}
.bar button{font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.prog{height:8px;background:#fff;border-radius:4px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.progt{font-size:14px;color:var(--sub);margin-top:4px}
.tools{display:flex;gap:8px;margin-top:8px}.tools button{flex:1;font:inherit;font-size:14px;font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 6px;color:var(--ink);cursor:pointer}
.tags{font-size:14px;color:var(--sub);font-weight:700}
.photo{margin-top:10px;background:#f1f3f5;border-radius:12px;overflow:hidden;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;cursor:zoom-in}
.photo img{display:block;width:100%;height:auto}
.zoomhint{font-size:13px;color:var(--sub);text-align:right;margin-top:2px}
.qt{font-size:19px;font-weight:800;margin:12px 0 4px;line-height:1.7}
.step{font-size:15px;font-weight:800;color:var(--blue);margin-top:16px}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;font:inherit;font-size:17px;font-weight:700;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px;margin-top:10px;cursor:pointer;line-height:1.5}
.ch .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-size:15px}
.ch:disabled{cursor:default;color:var(--ink)}
.ch.right{border-color:var(--green);background:#EBFBEE}.ch.right .n{background:var(--green);color:#fff}
.ch.wrong{border-color:var(--red);background:#FFF5F5}.ch.wrong .n{background:var(--red);color:#fff}
.cant{font:inherit;font-size:16px;font-weight:700;width:100%;margin-top:12px;padding:12px;border-radius:14px;border:2px dashed #adb5bd;background:#f8f9fa;color:var(--sub);cursor:pointer}
.cant.on{border-style:solid;border-color:#868e96;color:var(--ink)}
.res{border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:800;font-size:18px;text-align:center}
.res.ok{background:#EBFBEE;color:var(--green)}.res.ng{background:#FFF5F5;color:var(--red)}.res.na{background:#f1f3f5;color:var(--sub)}
.exp{background:#f8faf8;border-left:5px solid var(--green);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:17px}
.memo{background:#fff8e1;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.memo b{display:block;font-size:14px;color:#8a5a00}
.vd{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.v{font:inherit;font-size:17px;font-weight:800;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.v.on.a{border-color:var(--green);background:#EBFBEE;color:var(--green)}
.v.on.r{border-color:var(--red);background:#FFF5F5;color:var(--red)}
.saved{font-size:14px;color:var(--green);font-weight:700;text-align:center;margin-top:8px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.list a{display:block;padding:12px 4px;border-bottom:1px solid #eee;color:var(--ink);text-decoration:none;font-size:16px}
.list a small{color:var(--sub);display:block;font-size:13px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
#zoom img{width:100%;height:auto;margin:auto}
#zoom.x2 img{width:200%;max-width:none}
#zoom .close{position:fixed;top:10px;right:10px;background:#fff;border:0;border-radius:999px;font-size:16px;font-weight:800;padding:8px 14px}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap" id="app"><div class="box">読み込み中…</div></div>
<div id="zoom" hidden><button class="close" onclick="closeZoom()">✕ とじる</button><img id="zimg" alt=""></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient('https://hwctwbnzjjdllqsmlvqm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3Y3R3Ym56ampkbGxxc21sdnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzkzMDQsImV4cCI6MjA5NjQ1NTMwNH0.quP2UmR59c1ULUgZkqaq0kzeD8VlOY3cKH4ZaZJwtf0', {auth:{persistSession:false}});
const PH = '回答できない場合は、この欄に、『出題の意図がわからないので回答できない』など、その理由を書いてください。\n\nほかにも、まちがい・当院のやり方とちがうところ・わかりにくい言葉などがあれば、書いてください。';
const JOBS = {'クラーク': '受付・会計・電話', 'ナース': '看護師'};
const ls = { get(k){ try { return localStorage.getItem('tensaku_'+k) || '' } catch(e){ return '' } }, set(k,v){ try { localStorage.setItem('tensaku_'+k, v) } catch(e){} } };
const S = { code: ls.get('code'), name: ls.get('name'), job: ls.get('job'), names: [], qs: [], queue: [], cur: null, view: 'q', photos: {} };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
function order(q){ const idx = [0,1,2,3]; let h = hash(q.id); for (let i = 3; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (i+1); [idx[i], idx[j]] = [idx[j], idx[i]] } return idx }

// ---------- はじめの画面 ----------
function startView(msg){
  app.innerHTML = `<h1>📝 ポイントアップチャレンジ<br>問題の添削</h1>
  <div class="box">
    <div>スタッフが毎日スマホで答える問題の、見直しをお願いします。1問ずつ答えてみて、スタッフに出したほうがよいか、意見を書いてください。</div>
    <label class="t" for="code">① 合言葉</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="latin" value="${esc(S.code)}" placeholder="お知らせした合言葉">
    <div id="who" ${S.names.length ? '' : 'hidden'}>
      <label class="t" for="name">② お名前</label>
      <select id="name"><option value="">えらんでください</option>${S.names.map((n) => `<option ${n === S.name ? 'selected' : ''}>${esc(n)}</option>`).join('')}<option value="__other">一覧にない（書きこむ）</option></select>
      <input type="text" id="name2" placeholder="お名前（フルネーム）" hidden style="margin-top:8px">
      <label class="t">③ 職種</label>
      <div class="jobs">${Object.entries(JOBS).map(([k, v]) => `<button class="job ${S.job === k ? 'on' : ''}" data-job="${k}">${k}<small>${v}</small></button>`).join('')}</div>
    </div>
    <div class="err" id="err">${esc(msg || '')}</div>
    <button class="btn" id="go">${S.names.length ? '添削をはじめる' : 'つぎへ'}</button>
  </div>`;
  const sel = $('#name');
  if (sel) sel.onchange = () => { $('#name2').hidden = sel.value !== '__other' };
  if (S.name && sel && !S.names.includes(S.name)) { sel.value = '__other'; $('#name2').hidden = false; $('#name2').value = S.name }
  app.querySelectorAll('.job').forEach((b) => b.onclick = () => { S.job = b.dataset.job; app.querySelectorAll('.job').forEach((x) => x.classList.toggle('on', x === b)) });
  $('#go').onclick = async () => {
    const code = $('#code').value.trim();
    $('#go').disabled = true; $('#err').textContent = '';
    if (!S.names.length || code !== S.code) {
      const { data, error } = await db.rpc('qr_start', { p_code: code });
      $('#go').disabled = false;
      if (error) { $('#err').textContent = error.message.includes('合言葉') ? '合言葉がちがいます。もう一度たしかめてください。' : '通信できませんでした。電波のよいところで、もう一度押してください。'; return }
      S.code = code; ls.set('code', code); S.names = data.names || []; startView(); return
    }
    const nm = sel.value === '__other' ? $('#name2').value.trim() : sel.value;
    $('#go').disabled = false;
    if (!nm) { $('#err').textContent = 'お名前をえらんでください。'; return }
    if (!S.job) { $('#err').textContent = '職種をえらんでください。'; return }
    S.name = nm; ls.set('name', nm); ls.set('job', S.job);
    await load();
  };
}

// ---------- 問題を読みこむ ----------
async function load(keepId){
  app.innerHTML = '<div class="box">問題を読みこんでいます…</div>';
  const { data, error } = await db.rpc('qr_list', { p_code: S.code, p_job: S.job, p_reviewer: S.name });
  if (error) { S.names = []; return startView(error.message.includes('合言葉') ? '合言葉が変わりました。もう一度入れてください。' : '通信できませんでした。もう一度押してください。') }
  S.qs = data;
  // 自分がまだ答えていない問題を、みんなの回答が少ない順に（同じ数なら人ごとにちがう順番で）
  S.queue = S.qs.filter((q) => !q.mine).sort((a, b) => (a.n - b.n) || (hash(S.name + a.id) - hash(S.name + b.id)));
  if (keepId) { const i = S.queue.findIndex((q) => q.id === keepId); if (i > 0) S.queue.unshift(...S.queue.splice(i, 1)) }
  S.view = 'q'; next();
}
function stats(){
  const mine = S.qs.filter((q) => q.mine).length, done = S.qs.filter((q) => q.mine || q.n > 0).length;
  return { mine, done, all: S.qs.length };
}
function header(){
  const s = stats(), pct = s.all ? Math.round(s.done / s.all * 100) : 0;
  return `<div class="bar"><span class="who">${esc(S.name)}・${esc(S.job)}</span><span class="cnt">答えた数 ${s.mine}問</span></div>
  <div class="prog"><i style="width:${pct}%"></i></div>
  <div class="progt">${esc(S.job)}の問題 ${s.all}問のうち、みんなで ${s.done}問 見ました（${pct}%）</div>
  <div class="tools"><button onclick="listView()">📋 答えた問題を見直す</button><button onclick="S.names=[];startView()">名前・職種を変える</button></div>`;
}
function next(){
  S.cur = S.queue[0] ? { q: S.queue[0], picked: null, verdict: '', comment: '', edit: false } : null;
  render();
}
function openQ(id){
  const q = S.qs.find((x) => x.id === id); if (!q) return;
  S.cur = { q, picked: q.mine?.picked ?? null, verdict: q.mine?.verdict || '', comment: q.mine?.comment || '', edit: true };
  S.view = 'q'; render(); scrollTo(0, 0);
}
function listView(){
  const mine = S.qs.filter((q) => q.mine);
  app.innerHTML = header() + `<div class="box"><b>答えた問題（${mine.length}問）</b><div class="list">${mine.length ? mine.map((q) => `<a href="#" onclick="openQ('${q.id}');return false">No.${q.no}　${esc(q.question.slice(0, 40))}…<small>${q.mine.verdict === 'adopt' ? '👍 採用した方が良い' : q.mine.verdict === 'reject' ? '👎 不採用にした方が良い' : '意見なし'}${q.mine.comment ? '・コメントあり' : ''}</small></a>`).join('') : '<p>まだありません。</p>'}</div>
  <button class="btn" onclick="next();scrollTo(0,0)">問題にもどる</button></div>`;
  scrollTo(0, 0);
}

// ---------- 1問の画面 ----------
function render(){
  if (!S.cur) {
    app.innerHTML = header() + `<div class="box" style="text-align:center"><div style="font-size:52px">🎉</div><b>${esc(S.job)}の問題は、ぜんぶ答えました。</b><br>ご協力ありがとうございました。<br>答えた問題は「答えた問題を見直す」から直せます。</div>`;
    return;
  }
  const { q, picked, verdict, comment, edit } = S.cur, shown = picked !== null;
  const ord = order(q), clinic = q.clinic && q.clinic !== '全体' ? q.clinic + 'クリニック' : '法人全体';
  app.innerHTML = header() + `<div class="box">
    <div class="tags">No.${q.no}　${esc(clinic)}　${esc(q.area || '')}${q.n ? `　（${q.n}人が回答ずみ）` : ''}</div>
    ${q.hasPhoto ? `<div class="photo" id="ph" onclick="zoom()">写真を読みこみ中…</div><div class="zoomhint">写真を押すと大きくなります</div>` : ''}
    <div class="qt">${esc(q.question)}</div>
    <div class="step">STEP 1　まず、答えてみてください</div>
    ${ord.map((i, k) => `<button class="ch ${shown ? (i === 0 ? 'right' : i === picked ? 'wrong' : '') : ''}" ${shown ? 'disabled' : ''} onclick="pick(${i})"><span class="n">${k + 1}</span><span>${esc(q.choices[i])}</span></button>`).join('')}
    ${shown ? '' : `<button class="cant" onclick="pick(-1)">わからない・答えられない</button>`}
    ${shown ? `<div class="res ${picked === 0 ? 'ok' : picked === -1 ? 'na' : 'ng'}">${picked === 0 ? '⭕ 正解です' : picked === -1 ? '答えられなかった問題です' : '❌ ちがいます（緑が正解）'}</div>
      <div class="exp">${esc(q.explanation)}</div>
      ${q.memo ? `<div class="memo"><b>作った人が、確かめてほしいこと</b>${esc(q.memo)}</div>` : ''}
      <div class="step">STEP 2　この問題を、スタッフに出すことについて</div>
      <div class="vd">
        <button class="v a ${verdict === 'adopt' ? 'on' : ''}" onclick="setV('adopt')">👍 採用した方が良いと思う</button>
        <button class="v r ${verdict === 'reject' ? 'on' : ''}" onclick="setV('reject')">👎 不採用にした方が良いと思う</button>
      </div>
      <div class="step">STEP 3　意見・理由</div>
      <textarea id="cm" placeholder="${esc(PH)}">${esc(comment)}</textarea>
      <div class="err" id="err"></div>
      <button class="btn" id="save" onclick="save()">${edit ? '直して保存する' : '保存して、つぎの問題へ'}</button>`
    : `<div class="step" style="color:var(--sub)">STEP 2・3（意見を書く欄）は、答えると出てきます。</div>
       <textarea id="cm" placeholder="${esc(PH)}" style="margin-top:10px">${esc(comment)}</textarea>`}
    ${edit ? `<button class="btn ghost small" onclick="next();scrollTo(0,0)">直さずにもどる</button>` : `<button class="btn ghost small" onclick="skip()">この問題はあとで（とばす）</button>`}
  </div>`;
  const cm = $('#cm'); if (cm) cm.oninput = () => { S.cur.comment = cm.value };
  if (q.hasPhoto) loadPhoto(q.id);
}
async function loadPhoto(id){
  if (!S.photos[id]) {
    const { data } = await db.rpc('qr_photo', { p_code: S.code, p_qid: id });
    if (data) S.photos[id] = data;
  }
  const el = $('#ph'); if (el && S.cur?.q.id === id) el.innerHTML = S.photos[id] ? `<img src="${S.photos[id]}" alt="問題の写真">` : '写真を読みこめませんでした';
  // つぎの問題の写真も先に読んでおく
  const nx = S.queue[1]; if (nx?.hasPhoto && !S.photos[nx.id]) db.rpc('qr_photo', { p_code: S.code, p_qid: nx.id }).then(({ data }) => { if (data) S.photos[nx.id] = data });
}
function zoom(){ const src = S.photos[S.cur?.q.id]; if (!src) return; $('#zimg').src = src; const z = $('#zoom'); z.hidden = false; z.classList.remove('x2'); z.onclick = (e) => { if (e.target.tagName === 'IMG') z.classList.toggle('x2') } }
function closeZoom(){ $('#zoom').hidden = true }
function pick(i){
  S.cur.picked = i; render();
  if (i === -1) { const cm = $('#cm'); cm.focus({ preventScroll: true }); cm.scrollIntoView({ block: 'center', behavior: 'smooth' }) }
  else $('.res').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function setV(v){
  S.cur.verdict = S.cur.verdict === v ? '' : v;
  app.querySelectorAll('.v').forEach((b) => b.classList.toggle('on', (b.classList.contains('a') ? 'adopt' : 'reject') === S.cur.verdict));
}
function skip(){ const q = S.queue.shift(); S.queue.push(q); next(); scrollTo(0, 0) }
async function save(){
  const c = S.cur, cm = ($('#cm').value || '').trim(), err = $('#err');
  if (c.picked === -1 && !cm) { err.textContent = '答えられなかった理由を、STEP 3 の欄に書いてください。'; $('#cm').focus(); return }
  if (!c.verdict && !cm) { err.textContent = 'STEP 2 で、どちらかを押してください。'; return }
  $('#save').disabled = true; err.textContent = '';
  const { error } = await db.rpc('qr_save', { p_code: S.code, p_reviewer: S.name, p_job: S.job, p_qid: c.q.id, p_picked: c.picked, p_verdict: c.verdict, p_comment: cm });
  if (error) { $('#save').disabled = false; err.textContent = '保存できませんでした。電波のよいところで、もう一度押してください。'; return }
  c.q.mine = { picked: c.picked, verdict: c.verdict, comment: cm };
  if (!c.edit) { c.q.n++; S.queue = S.queue.filter((q) => q.id !== c.q.id) }
  next(); scrollTo(0, 0);
}

if (S.code && S.name && S.job) load(); else startView();
</script>
</body></html>
