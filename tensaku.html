<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>問題の添削</title>
<style>
/* 問題カードは、本番のチャレンジ画面（チャレンジ問題サンプル）と同じ見た目 */
:root{--bg:#eef3ef;--card:#ffffff;--fg:#1d2621;--sub:#5d6b63;--line:#d6dfd9;--accent:#1f6f54;--ok:#1d7a3e;--okbg:#e7f6ec;--ng:#b42318;--ngbg:#fdecea;--tag:#e3ece6;
--rv:#fff8e6;--rvline:#f0d9a0;--rvink:#7a5300;--blue:#1c64b0;
--f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.3rem;margin:4px 0 0;line-height:1.5}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
label.t{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
textarea{min-height:150px;line-height:1.6;resize:vertical}
textarea::placeholder{color:#9aa3a0}
.btn{display:block;width:100%;font:inherit;font-size:18px;font-weight:800;border:0;border-radius:14px;padding:15px;margin-top:14px;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--fg);border:2px solid var(--line);font-weight:700;font-size:16px;padding:11px}
.jobs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pts{background:#f3f7f4;border-radius:12px;padding:10px 12px;font-size:.95rem}
.pts b{display:block;font-size:.85rem;color:var(--accent)}
.pts ul{margin:4px 0 0;padding-left:1.2em}
.aim{font-size:.85rem;color:var(--sub)}
.ai{background:#fff;border:2px solid #cfe0f5;border-radius:12px;padding:12px 14px;font-size:1rem;line-height:1.75;white-space:pre-wrap}
.ai .lb{display:block;white-space:normal;font-size:.85rem;font-weight:800;color:#1c64b0;margin-bottom:4px}
.ainote{background:#eef5fd;border-radius:10px;padding:9px 12px;font-size:.92rem;font-weight:700;color:#1c4f8a;line-height:1.6}
.job{font:inherit;font-size:18px;font-weight:800;padding:16px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.4;color:var(--fg)}
.job small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.job.on{border-color:var(--accent);background:var(--okbg)}
.err{color:var(--ng);font-weight:700;margin-top:10px}
/* 上の帯 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800}
.bar .who{font-size:16px}.bar .cnt{font-size:15px;white-space:nowrap}
.bar.pv{background:#7a5300}
.prog{height:8px;background:#fff;border-radius:4px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:#3fb27f}
.pj{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-top:4px}.pjl{width:4.5em}.pjb{flex:1;height:10px;background:#e3ece6;border-radius:5px;overflow:hidden}.pjb i{display:block;height:100%;background:#3fb27f}.pjv{width:3em;text-align:right}
.progt{font-size:14px;color:var(--sub);margin-top:4px}
.tools{display:flex;gap:8px;margin-top:8px}.tools button,.tools select,.tools input{flex:1;font:inherit;font-size:14px;font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 8px;color:var(--fg);cursor:pointer;min-width:0}
/* ---- 本番と同じ問題カード ---- */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.no{font-weight:800;color:var(--accent);margin-right:4px}
.tag{font-size:.78rem;background:var(--tag);border-radius:999px;padding:2px 10px}
.tag.soft{color:var(--sub)}
.ph{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.ph img{max-width:100%;max-height:440px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#f3f5f4}
.ph .wait{width:100%;height:180px;border-radius:10px;background:#f3f5f4;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:.85rem}
.ph figcaption{font-size:.78rem;color:var(--sub);text-align:center}
.qt{margin:0;font-size:1.05rem;font-weight:700}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:.98rem;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.6}
.ch:disabled{cursor:default;color:var(--fg)}
.ch .n{font-weight:800;color:var(--accent)}
.ch.right{border-color:var(--ok);background:var(--okbg)}
.ch.wrong{border-color:var(--ng);background:var(--ngbg)}
.ans{border-radius:12px;background:var(--okbg);padding:10px 12px}
.ans.ng{background:var(--ngbg)}
.ans .res{margin:0;font-weight:800}
.ans .ex{margin:4px 0 0}
/* ---- ここから下は添削用（本番には出ない） ---- */
.rv{background:var(--rv);border:1.5px solid var(--rvline);border-radius:16px;padding:14px 16px}
.rv .hd{font-size:.8rem;font-weight:800;color:var(--rvink);letter-spacing:.02em}
.cant{font:inherit;font-size:16px;font-weight:700;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:2px dashed #c9b27a;background:#fff;color:var(--rvink);cursor:pointer}
.memo{background:#fff;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.memo b{display:block;font-size:.82rem;color:var(--rvink)}
.step{font-size:.95rem;font-weight:800;color:var(--rvink);margin-top:14px}
.vd{display:grid;gap:10px;margin-top:8px}
.v{font:inherit;font-size:17px;font-weight:800;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--fg)}
.v.on.a{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.v.on.r{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.rv textarea{margin-top:8px}
.list a{display:block;padding:12px 4px;border-bottom:1px solid #eee;color:var(--fg);text-decoration:none;font-size:16px}
.list a small{color:var(--sub);display:block;font-size:13px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
#zoom img{width:100%;max-width:900px;height:auto;margin:auto}
#zoom.x2 img{width:200%;max-width:none}
#zoom .close{position:fixed;top:10px;right:10px;background:#fff;border:0;border-radius:999px;font-size:16px;font-weight:800;padding:8px 14px;z-index:2}
#zoom .hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#ddd;font-size:13px}
[hidden]{display:none!important}
</style>
</head><body>
<main id="app"><div class="box">読み込み中…</div></main>
<div id="zoom" hidden><button class="close" onclick="closeZoom()">✕ とじる</button><img id="zimg" alt=""><div class="hint">写真を押すと、さらに大きくなります</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient('https://hwctwbnzjjdllqsmlvqm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3Y3R3Ym56ampkbGxxc21sdnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzkzMDQsImV4cCI6MjA5NjQ1NTMwNH0.quP2UmR59c1ULUgZkqaq0kzeD8VlOY3cKH4ZaZJwtf0', {auth:{persistSession:false}});
const PH = '回答できない場合は、この欄に、『出題の意図がわからないので回答できない』など、その理由を書いてください。\n\nほかにも、まちがい・当院のやり方とちがうところ・わかりにくい言葉などがあれば、書いてください。';
const JOBS = {'クラーク': '受付・会計・電話', 'ナース': '看護師', '医師': '記述式の質問'};
const PH_OPEN = 'ここに答えを書いてください（箇条書きで大丈夫です）。\n\n答えられない場合は、この欄に、『出題の意図がわからないので回答できない』など、その理由を書いてください。';
const PH_AI = '直すところを書いてください（箇条書きで大丈夫です）。\n例：「3つ目の目安は48時間ではなく24時間」「〇〇の説明が足りない」\n\n「（当院の決まりを書き入れてください）」のところは、わかる範囲で書いてください。\n質問の意味がわからない場合は、その理由を書いてください。';
const AI_NOTE = 'この回答はAIで作成しました。医学的に間違えているところや、質問の意味が不明瞭なところがあれば教えてください。';
const NUM = '①②③④';
const PREVIEW = new URLSearchParams(location.search).has('preview');
const ls = { get(k){ try { return localStorage.getItem('tensaku_'+k) || '' } catch(e){ return '' } }, set(k,v){ try { localStorage.setItem('tensaku_'+k, v) } catch(e){} } };
const ss = { get(k){ try { return sessionStorage.getItem('tensaku_'+k) || '' } catch(e){ return '' } }, set(k,v){ try { sessionStorage.setItem('tensaku_'+k, v) } catch(e){} } };
const S = { code: PREVIEW ? ss.get('admin') : ls.get('code'), name: ls.get('name').replace(/[\s\u3000]+/g, ''), job: ls.get('job'), names: [], qs: [], queue: [], cur: null, photos: {}, pvi: 0, pvf: '' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
function normName(v){ return String(v || '').replace(/[\s\u3000]+/g, '').replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)) }
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return h >>> 0 }
// 選択肢の並び（本番と同じく順番をまぜる。問題ごとに決まった順）
function order(q){ const idx = [0,1,2,3]; let h = hash(q.id); for (let i = 3; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (i+1); [idx[i], idx[j]] = [idx[j], idx[i]] } return idx }
const toTop = () => scrollTo(0, 0);

// ================= はじめの画面（スタッフ） =================
function startView(msg){
  app.innerHTML = `<h1>📝 ポイントアップチャレンジ　問題の添削</h1>
  <div class="box">
    <div>スタッフが毎日スマホで答える問題の、見直しをお願いします。本番と同じ画面で1問ずつ答えてみて、スタッフに出したほうがよいか、意見を書いてください。</div>
    <label class="t" for="code">① 合言葉</label>
    <input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.code)}" placeholder="お知らせした合言葉">
    <div id="who" ${S.ok ? '' : 'hidden'}>
      <label class="t" for="name">② お名前</label>
      <div style="font-size:.95rem;margin-bottom:6px">ひらがなでフルネームを入れてください。</div>
      <input type="text" id="name" autocomplete="off" value="${esc(S.name)}" placeholder="例：ふくみみ はなこ">
      <label class="t">③ 職種</label>
      <div class="jobs">${Object.entries(JOBS).map(([k, v]) => `<button class="job ${S.job === k ? 'on' : ''}" data-job="${k}">${k}<small>${v}</small></button>`).join('')}</div>
    </div>
    <div class="err" id="err">${esc(msg || '')}</div>
    <button class="btn" id="go">${S.ok ? '添削をはじめる' : 'つぎへ'}</button>
  </div>`;
  app.querySelectorAll('.job').forEach((b) => b.onclick = () => { S.job = b.dataset.job; app.querySelectorAll('.job').forEach((x) => x.classList.toggle('on', x === b)) });
  $('#go').onclick = async () => {
    const code = $('#code').value.trim();
    $('#go').disabled = true; $('#err').textContent = '';
    if (!S.ok || code !== S.code) {
      const { data, error } = await db.rpc('qr_start', { p_code: code });
      $('#go').disabled = false;
      if (error) { $('#err').textContent = error.message.includes('合言葉') ? '合言葉がちがいます。もう一度たしかめてください。' : '通信できませんでした。電波のよいところで、もう一度押してください。'; return }
      S.code = code; ls.set('code', code); S.ok = true; startView(); return
    }
    // スペース（全角・半角）は無視し、カタカナはひらがなにそろえる
    const nm = normName($('#name').value);
    $('#go').disabled = false;
    if (!nm) { $('#err').textContent = 'お名前を、ひらがなでフルネームで入れてください。'; return }
    if (!/^[\u3041-\u309Fー]+$/.test(nm)) { $('#err').textContent = 'お名前は、ひらがなで入れてください（漢字やローマ字は使えません）。'; return }
    if (!S.job) { $('#err').textContent = '職種をえらんでください。'; return }
    S.name = nm; ls.set('name', nm); ls.set('job', S.job);
    await load();
  };
}
async function load(){
  app.innerHTML = '<div class="box">問題を読みこんでいます…</div>';
  const { data, error } = await db.rpc('qr_list', { p_code: S.code, p_job: S.job, p_reviewer: S.name });
  if (error) { S.ok = false; return startView(error.message.includes('合言葉') ? '合言葉が変わりました。もう一度入れてください。' : '通信できませんでした。もう一度押してください。') }
  S.qs = data; S.skip = [];
  next();
}
// 職種ごとの到達率（その職種の問題のうち、だれか1人でも答えた問題の割合）
async function loadProgress(){
  const { data } = await db.rpc('qr_progress', { p_code: S.code });
  if (data) { S.progress = data; const el = $('#progbox'); if (el) el.innerHTML = progHTML() }
}
function progHTML(){
  const P = S.progress || {};
  return `<div class="progt" style="margin-top:0">みんなの到達率</div>` + ['クラーク', 'ナース', '医師'].filter((j) => j !== '医師' || (S.progress && S.progress['医師'])).map((j) => {
    const p = P[j] || { all: 0, seen: 0 }, pct = p.all ? Math.round(p.seen / p.all * 100) : 0;
    return `<div class="pj"><span class="pjl">${j}</span><span class="pjb"><i style="width:${pct}%"></i></span><span class="pjv">${pct}%</span></div>`;
  }).join('');
}
function header(){
  if (PREVIEW) {
    const list = pvList();
    return `<div class="bar pv"><span class="who">👀 スタッフの画面の確認（先生用）</span><span class="cnt">${list.length ? S.pvi + 1 : 0} / ${list.length}問</span></div>
    <div class="progt">スタッフと同じ画面です。答えたり意見を書いたりしても、保存されません。</div>
    <div class="box" id="progbox" style="padding:10px 14px;margin-top:8px">${progHTML()}</div>
    <div class="tools"><button onclick="pvGo(-1)">◀ まえ</button><input id="pvno" type="text" inputmode="numeric" placeholder="No.で開く" onchange="pvJump(this.value)"><button onclick="pvGo(1)">つぎ ▶</button></div>
    <div class="tools"><select onchange="S.pvf=this.value;S.pvi=0;pvShow()">${[['', `すべて（${S.qs.length}問）`], ['クラーク', 'クラーク向け'], ['ナース', 'ナース向け'], ['クラーク・ナース', '両方向け'], ['医師', '医師向け'], ['photo', '写真つき']].map(([v, l]) => `<option value="${v}" ${S.pvf === v ? 'selected' : ''}>${l}</option>`).join('')}</select><button onclick="location.href='tensaku-admin.html'">集計にもどる</button></div>`;
  }
  return `<div><div class="bar"><span class="who">${esc(S.name)}・${esc(S.job)}</span></div>
  <div class="box" id="progbox" style="padding:10px 14px;margin-top:8px">${progHTML()}</div>
  <div class="tools"><button onclick="listView()">📋 答えた問題を見直す</button><button onclick="S.ok=false;startView()">名前・職種を変える</button></div></div>`;
}
// つぎの問題はサーバーが決める：まだ誰も答えていない問題 → 答えが少ない問題。ほかの人に出している最中の問題はあとに回す
async function next(){
  app.innerHTML = header() + '<div class="box">つぎの問題を用意しています…</div>'; toTop(); loadProgress();
  let { data, error } = await db.rpc('qr_next', { p_code: S.code, p_job: S.job, p_reviewer: S.name, p_skip: S.skip });
  if (!error && !data && S.skip.length) { S.skip = []; ({ data, error } = await db.rpc('qr_next', { p_code: S.code, p_job: S.job, p_reviewer: S.name, p_skip: [] })) }
  if (error) { app.innerHTML = header() + '<div class="box">通信できませんでした。<button class="btn" onclick="next()">もう一度</button></div>'; return }
  const q = data ? S.qs.find((x) => x.id === data) : null;
  S.cur = q ? { q, picked: null, verdict: '', comment: '', edit: false } : null;
  render(); toTop();
}
function openQ(id){
  const q = S.qs.find((x) => x.id === id); if (!q) return;
  S.cur = { q, picked: q.mine?.picked ?? null, verdict: q.mine?.verdict || '', comment: q.mine?.comment || '', edit: true };
  render(); toTop();
}
function listView(){
  const mine = S.qs.filter((q) => q.mine);
  app.innerHTML = header() + `<div class="box"><b>答えた問題（${mine.length}問）</b><div class="list">${mine.length ? mine.map((q) => `<a href="#" onclick="openQ('${q.id}');return false">No.${q.no}　${esc(q.question.slice(0, 40))}…<small>${q.kind === 'open' ? (q.explanation ? (q.mine.verdict === 'adopt' ? '👍 この解答例で良い' : q.mine.verdict === 'reject' ? '✏️ 直すところがある' : '意見を書いた') : '答えを書いた') : (q.mine.verdict === 'adopt' ? '👍 採用した方が良い' : q.mine.verdict === 'reject' ? '👎 不採用にした方が良い' : '意見なし') + (q.mine.comment ? '・コメントあり' : '')}</small></a>`).join('') : '<p>まだありません。</p>'}</div>
  <button class="btn" onclick="next()">問題にもどる</button></div>`;
  toTop();
}

// ================= 1問の画面 =================
function srcTitle(q){ const m = String(q.source || '').match(/「(.+?)」/); return m ? m[1] : '' }
function card(q, picked){
  const shown = picked !== null, ord = order(q);
  const clinic = q.clinic && q.clinic !== '全体' ? q.clinic : '法人全体';
  const rightPos = ord.indexOf(0);
  const t = srcTitle(q);
  return `<article class="q">
    <header class="qh"><span class="no">No.${q.no}</span><span class="tag">${esc(q.target)}</span><span class="tag">${esc(clinic)}</span>${q.area ? `<span class="tag soft">${esc(q.area)}</span>` : ''}</header>
    ${q.hasPhoto ? `<figure class="ph" id="ph"><div class="wait">写真を読みこみ中…</div><figcaption>${t && /動画/.test(q.source || '') ? `手順書「${esc(t)}」の写真　` : ''}押すと写真の全体が大きく見られます</figcaption></figure>` : ''}
    <p class="qt">${esc(q.question)}</p>
    <div class="chs">${ord.map((i, k) => `<button class="ch ${shown ? (i === 0 ? 'right' : i === picked ? 'wrong' : '') : ''}" ${shown ? 'disabled' : ''} onclick="pick(${i})" type="button"><span class="n">${NUM[k]}</span><span>${esc(q.choices[i])}</span></button>`).join('')}</div>
    ${shown ? `<div class="ans ${picked === 0 ? '' : 'ng'}"><p class="res">${picked === 0 ? '⭕ 正解！ +3P' : picked === -1 ? `正解は ${NUM[rightPos]}` : `❌ ざんねん　正解は ${NUM[rightPos]}`}</p><p class="ex">${esc(q.explanation)}</p></div>` : ''}
  </article>`;
}
function openCard(q){
  const clinic = q.clinic && q.clinic !== '全体' ? q.clinic : '法人全体';
  return `<article class="q">
    <header class="qh"><span class="no">No.${q.no}</span><span class="tag">医師への質問</span><span class="tag">${esc(clinic)}</span>${q.area ? `<span class="tag soft">${esc(q.area)}</span>` : ''}</header>
    <p class="qt">${esc(q.question)}</p>
    ${q.explanation ? `<div class="ai"><span class="lb">🤖 AIが作った解答例</span>${esc(q.explanation)}</div>
    <div class="ainote">${esc(AI_NOTE)}</div>` : (q.points || []).length ? `<div class="pts"><b>答えに入れていただきたいこと</b><ul>${q.points.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${q.aim ? `<div class="aim">📘 この答えから作るもの：${esc(q.aim)}</div>` : ''}
  </article>`;
}
function renderOpen(){
  const { q, comment, edit, verdict } = S.cur, ai = !!q.explanation;
  app.innerHTML = header() + openCard(q) + `<section class="rv">
    ${ai ? `<div class="hd">✏️ この解答例について</div>
    <div class="vd">
      <button class="v a ${verdict === 'adopt' ? 'on' : ''}" onclick="setV('adopt')">👍 この解答例で良い</button>
      <button class="v r ${verdict === 'reject' ? 'on' : ''}" onclick="setV('reject')">✏️ 直すところがある</button>
    </div>
    <div class="step">直すところ・足りないところ</div>
    <textarea id="cm" style="min-height:200px" placeholder="${esc(PH_AI)}">${esc(comment)}</textarea>`
    : `<div class="hd">✏️ 答え</div>
    <textarea id="cm" style="min-height:220px" placeholder="${esc(PH_OPEN)}">${esc(comment)}</textarea>`}
    <div class="err" id="err"></div>
    <button class="btn" id="save" onclick="save()">${PREVIEW ? 'つぎの質問へ（確認画面なので保存しません）' : edit ? '直して保存する' : '保存して、つぎの質問へ'}</button>
    ${PREVIEW ? '' : edit ? `<button class="btn ghost" onclick="listView()">直さずに一覧へもどる</button>` : `<button class="btn ghost" onclick="skip()">この質問はあとで（とばす）</button>`}
  </section>`;
  const cm = $('#cm'); cm.oninput = () => { S.cur.comment = cm.value };
}
function render(){
  if (S.cur && S.cur.q.kind === 'open') return renderOpen();
  if (!S.cur) {
    app.innerHTML = header() + `<div class="box" style="text-align:center"><div style="font-size:52px">🎉</div><b>${esc(S.job)}${S.job === '医師' ? '向けの質問' : 'の問題'}は、ぜんぶ答えました。</b><br>ご協力ありがとうございました。<br>答えた問題は「答えた問題を見直す」から直せます。</div>`;
    return;
  }
  const { q, picked, verdict, comment, edit } = S.cur, shown = picked !== null;
  app.innerHTML = header() + card(q, picked) + `<section class="rv">
    <div class="hd">✏️ ここから下は添削用です（本番の画面には出ません）</div>
    ${shown ? `
      ${q.memo ? `<div class="memo"><b>作った人が、確かめてほしいこと</b>${esc(q.memo)}</div>` : ''}
      <div class="step">この問題を、スタッフに出すことについて</div>
      <div class="vd">
        <button class="v a ${verdict === 'adopt' ? 'on' : ''}" onclick="setV('adopt')">👍 採用した方が良いと思う</button>
        <button class="v r ${verdict === 'reject' ? 'on' : ''}" onclick="setV('reject')">👎 不採用にした方が良いと思う</button>
      </div>
      <div class="step">意見・理由</div>
      <textarea id="cm" placeholder="${esc(PH)}">${esc(comment)}</textarea>
      <div class="err" id="err"></div>
      <button class="btn" id="save" onclick="save()">${PREVIEW ? 'つぎの問題へ（確認画面なので保存しません）' : edit ? '直して保存する' : '保存して、つぎの問題へ'}</button>`
    : `<div style="font-size:.95rem;margin-top:6px">まず上の問題に答えてください。答えると、正解と解説、意見を書く欄が出ます。</div>
       <button class="cant" onclick="pick(-1)">わからない・答えられない</button>
       <textarea id="cm" placeholder="${esc(PH)}">${esc(comment)}</textarea>`}
    ${PREVIEW ? '' : edit ? `<button class="btn ghost" onclick="listView()">直さずに一覧へもどる</button>` : `<button class="btn ghost" onclick="skip()">この問題はあとで（とばす）</button>`}
  </section>`;
  const cm = $('#cm'); if (cm) cm.oninput = () => { S.cur.comment = cm.value };
  if (q.hasPhoto) loadPhoto(q.id);
}
async function getPhoto(id){
  if (!S.photos[id]) { const { data } = await db.rpc('qr_photo2', { p_code: S.code, p_qid: id }); if (data) S.photos[id] = data }
  return S.photos[id];
}
async function loadPhoto(id){
  const p = await getPhoto(id);
  const el = $('#ph'); if (!el || S.cur?.q.id !== id) return;
  const w = el.querySelector('.wait');
  if (p?.photo) { const img = new Image(); img.alt = '問題の写真'; img.src = p.photo; img.onclick = zoom; w.replaceWith(img) } else w.textContent = '写真を読みこめませんでした';
  const nx = PREVIEW ? pvList()[S.pvi + 1] : null; if (nx?.hasPhoto) getPhoto(nx.id);
}
function zoom(){ const p = S.photos[S.cur?.q.id]; if (!p) return; $('#zimg').src = p.full || p.photo; const z = $('#zoom'); z.hidden = false; z.classList.remove('x2'); z.scrollTo(0, 0); z.onclick = (e) => { if (e.target.tagName === 'IMG') z.classList.toggle('x2') } }
function closeZoom(){ $('#zoom').hidden = true }
function pick(i){
  S.cur.picked = i; render();
  if (i === -1) { const cm = $('#cm'); cm.focus({ preventScroll: true }); cm.scrollIntoView({ block: 'center', behavior: 'smooth' }) }
  else $('.ans').scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function setV(v){
  S.cur.verdict = S.cur.verdict === v ? '' : v;
  app.querySelectorAll('.v').forEach((b) => b.classList.toggle('on', (b.classList.contains('a') ? 'adopt' : 'reject') === S.cur.verdict));
}
function skip(){ S.skip.push(S.cur.q.id); next() }
async function save(){
  const c = S.cur, cm = ($('#cm').value || '').trim(), err = $('#err');
  if (c.q.kind === 'open' && c.q.explanation) {
    if (!c.verdict && !cm) { err.textContent = '「この解答例で良い」「直すところがある」のどちらかを押してください。'; return }
    if (c.verdict === 'reject' && !cm) { err.textContent = '直すところを書いてください。'; $('#cm').focus(); return }
  } else if (c.q.kind === 'open' && !cm) { err.textContent = '答えを書いてください。答えられない場合は、その理由を書いてください。'; $('#cm').focus(); return }
  if (c.q.kind !== 'open') {
  if (c.picked === -1 && !cm) { err.textContent = '答えられなかった理由を、意見・理由の欄に書いてください。'; $('#cm').focus(); return }
  if (!c.verdict && !cm) { err.textContent = '「採用した方が良いと思う」「不採用にした方が良いと思う」のどちらかを押してください。'; return }
  }
  if (PREVIEW) return pvGo(1);
  $('#save').disabled = true; err.textContent = '';
  const { error } = await db.rpc('qr_save', { p_code: S.code, p_reviewer: S.name, p_job: S.job, p_qid: c.q.id, p_picked: c.picked, p_verdict: c.verdict, p_comment: cm });
  if (error) { $('#save').disabled = false; err.textContent = '保存できませんでした。電波のよいところで、もう一度押してください。'; return }
  c.q.mine = { picked: c.picked, verdict: c.verdict, comment: cm };
  if (c.edit) { listView(); return }
  next();
}

// ================= 先生用：スタッフの画面の確認（保存しない） =================
function pvList(){ return S.qs.filter((q) => !S.pvf || (S.pvf === 'photo' ? q.hasPhoto : q.target === S.pvf)) }
function pvShow(){
  const list = pvList(); S.pvi = Math.max(0, Math.min(S.pvi, list.length - 1));
  const q = list[S.pvi]; S.cur = q ? { q, picked: null, verdict: '', comment: '', edit: false } : null;
  if (q) history.replaceState(null, '', '?preview#no=' + q.no);
  render(); toTop();
}
function pvGo(d){ S.pvi += d; pvShow() }
function pvJump(v){ const n = parseInt(String(v).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), 10); const i = pvList().findIndex((q) => q.no === n); if (i >= 0) { S.pvi = i; pvShow() } else alert('その番号の問題はありません') }
async function pvStart(msg){
  if (!S.code) {
    app.innerHTML = `<h1>👀 スタッフの画面の確認（先生用）</h1><div class="box">先生用の合言葉を入れてください。<input type="password" id="ac" style="margin-top:8px"><div class="err">${esc(msg || '')}</div><button class="btn" onclick="S.code=$('#ac').value.trim();pvStart()">見る</button></div>`;
    return;
  }
  app.innerHTML = '<div class="box">問題を読みこんでいます…</div>';
  const { data, error } = await db.rpc('qr_admin', { p_code: S.code });
  if (error) { S.code = ''; return pvStart('合言葉がちがいます。') }
  ss.set('admin', S.code);
  S.qs = data.questions; loadProgress();
  const m = location.hash.match(/no=(\d+)/); if (m) S.pvi = Math.max(0, S.qs.findIndex((q) => q.no === +m[1]));
  pvShow();
}

if (PREVIEW) pvStart();
else if (S.code && S.name && S.job) load(); else startView();
</script>
</body></html>
