<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q&amp;A（見本）</title>
<link rel="stylesheet" href="style.css?v=14">
<style>
/* 上のバーと下の入力欄は動かさず、間の会話だけをスクロールする。
   高さは「いま見えている画面の高さ」(dvh)。iPhoneの下のツールバーの上に収まる */
html{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.top,.bar{flex:none}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid #dde1e5}
.back{font-size:17px;font-weight:700;background:var(--bg);border:0;border-radius:12px;padding:10px 14px;color:var(--ink);text-decoration:none}
.top h1{font-size:22px;margin:0}
.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px;max-width:440px;width:100%;margin:0 auto}
.hint{font-size:15px;color:var(--sub);background:#fff;border-radius:16px;padding:12px 14px;line-height:1.6}
.msg{margin:12px 0;display:flex}
.msg .b{max-width:85%;padding:12px 14px;border-radius:18px;font-size:17px;line-height:1.6;white-space:pre-wrap}
.me{justify-content:flex-end}.me .b{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai .b{background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.src{display:block;margin-top:8px;font-size:14px;color:#1f6fb2}
.ask-admin{margin-top:10px;font-size:15px;font-weight:700;background:#fff4e0;border:1px solid #f0c98a;border-radius:12px;padding:8px 12px;color:#8a5a00}
.bar{background:#fff;border-top:1px solid #dde1e5;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.inner{max-width:440px;margin:0 auto}
.status{text-align:center;font-size:15px;color:var(--sub);margin-bottom:6px}
.status:empty{display:none}
.status.on{color:var(--red);font-weight:700}
/* 入力欄の中にマイク（右はし） */
.kb{display:flex;gap:8px;align-items:center}
.field{position:relative;flex:1;min-width:0}
.field input{width:100%;font-size:17px;padding:13px 58px 13px 14px;border:1px solid #c9ced4;border-radius:24px;background:#fff}
.mic{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;
  background:var(--accent);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
.mic.off{background:#c9ced4}
@keyframes pulse{50%{opacity:.6}}
.kb .send{flex:none;height:50px;font-size:17px;font-weight:700;border:0;border-radius:25px;padding:0 18px;background:var(--ink);color:#fff;cursor:pointer}
</style>
</head><body>

<div class="top"><a class="back" href="index.html">← もどる</a><h1>Q&amp;A　AIに質問</h1></div>

<div class="log" id="log">
  <div class="mockbar">見本です。AIはまだつながっていません。答えは決まった例を出します。</div>
  <a class="hint" id="baseAI" style="display:block;background:#fff4e0;color:inherit;text-decoration:none;margin-bottom:8px">✨ <b>いまはここから</b>：HUKU BASE の「AIに聞く」を開く ›<br><small>この画面の AI はまだつながっていません</small></a>
  <div class="hint">入力欄の 🎤 を押して、話しかけてください。<br>文字で打ってもかまいません。<br>業務マニュアルと掲示板から答えを探します。</div>
  <div class="msg me"><div class="b">電話でコロナの検査費用を聞かれたら、いくらって答えればいい？</div></div>
  <div class="msg ai"><div class="b">コロナの検査は 1,600円 程度、インフルエンザは 1,000円 程度とご案内しています（保険3割負担の場合のめやす）。
<a class="src" href="#">📖 業務マニュアル「電話での検査費用の案内」（11/20 更新）</a></div></div>
</div>

<div class="bar"><div class="inner">
  <div class="status" id="status"></div>
  <form class="kb" id="form">
    <div class="field">
      <input id="q" placeholder="ここに質問を入力" enterkeyhint="send" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="声で入力">🎤</button>
    </div>
    <button class="send">送る</button>
  </form>
</div></div>

<script>
const log=document.getElementById('log'), q=document.getElementById('q'),
      mic=document.getElementById('mic'),
      status=document.getElementById('status');

function add(cls,html){
  const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML='<div class="b"></div>'; d.firstChild.innerHTML=html;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ask(text){
  text=text.trim(); if(!text) return;
  add('me',esc(text)); q.value='';
  setTimeout(()=>add('ai','（見本の答え）本番では、ここに AI が業務マニュアルと掲示板から探した答えと、その出典が出ます。<br>'+
    '<button class="ask-admin" onclick="this.textContent=\'✓ 管理者に送りました（見本）\'">答えが違う・見つからない → 管理者に聞く</button>'),600);
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();ask(q.value)});

// 音声入力（Chrome・Android・iPhone の Safari で使える）
// iPhone では「同じ聞き取り係を使い回す」と2回目から文字が返ってこないことがあるので、毎回新しく作る。
// また、iPhone は「確定」の合図を出さずに終わることがあるので、終わった時点で聞き取れた文字を使う。
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, heard='', sent=false;
if(!SR){
  mic.classList.add('off');
  mic.addEventListener('click',()=>{status.textContent='キーボードのマイク（🎤）で話して入力してください';q.focus()});
}else{
  mic.addEventListener('pointerdown',e=>e.preventDefault()); // 押したときに入力欄へカーソルが移らないように
  mic.addEventListener('click',()=>listening?finish():start());
}
function start(){
  q.blur(); // キーボードを閉じてから聞く（キーボードの音声入力とぶつからないように）
  heard=''; sent=false; q.value='';
  rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=false;
  rec.onresult=e=>{
    let t=''; for(const r of e.results) t+=r[0].transcript;
    heard=t; q.value=t; status.textContent='● '+t;
    if(e.results[e.results.length-1].isFinal) finish();
  };
  rec.onerror=e=>{
    if(e.error==='aborted') return;
    status.className='status';
    status.textContent=e.error==='not-allowed'?'マイクの使用が許可されていません（設定 → Safari → マイク）':
      e.error==='no-speech'?'声が聞こえませんでした。もう一度どうぞ':'聞き取れませんでした。もう一度どうぞ';
    listening=false; mic.classList.remove('on');
  };
  rec.onend=()=>finish(true);
  try{rec.start()}catch(_){}
  listening=true; mic.classList.add('on');
  status.className='status on'; status.textContent='● 話してください（🎤をもう一度押すと止まります）';
}
function finish(ended){
  if(!listening&&ended) return;
  listening=false; mic.classList.remove('on');
  if(!ended&&rec){try{rec.stop()}catch(_){}}
  if(heard.trim()&&!sent){sent=true; status.className='status'; status.textContent=''; ask(heard)}
  else if(!heard.trim()&&ended&&status.classList.contains('on')){status.className='status'; status.textContent='声が聞こえませんでした。もう一度どうぞ'}
}
</script>
<script>
// iPhone でキーボードが出ているときだけ、キーボードの上までの高さにする（閉じたら元にもどす）
(()=>{const vv=window.visualViewport;if(!vv)return;const b=document.body;
const fit=()=>{if(vv.height<innerHeight-120){b.style.height=vv.height+'px';scrollTo(0,0);log.scrollTop=log.scrollHeight}else b.style.height=''};
vv.addEventListener('resize',fit);})();
</script>
<script src="links.js?v=1"></script><script>document.getElementById('baseAI').href=LINKS.board()</script>
</body></html>
